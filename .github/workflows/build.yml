name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Chrome and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "152"
          install-chromedriver: true
      - name: Output Chrome Info
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[testing] --no-cache-dir
      - name: Run tests
        env:
          MINIWOB_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          MINIWOB_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          pytest -n logical -v --timeout=120 tests/test_api.py
          pytest -v --timeout=60 --ignore=tests/test_api.py tests/
